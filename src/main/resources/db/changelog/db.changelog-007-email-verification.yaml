databaseChangeLog:
  - changeSet:
      id: 007-email-verification
      author: codex
      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column: { name: token_hash, type: varchar(128), constraints: { nullable: false, unique: true } }
              - column: { name: expires_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: used_at, type: timestamp with time zone }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_email_verification_user_id
            columns:
              - column: { name: user_id }
        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_email_verification_email
            columns:
              - column: { name: email }
