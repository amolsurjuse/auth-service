databaseChangeLog:
  - changeSet:
      id: 006-oauth-identities
      author: codex
      changes:
        - createTable:
            tableName: oauth_identities
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: provider, type: varchar(32), constraints: { nullable: false } }
              - column: { name: provider_subject, type: varchar(255), constraints: { nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column:
                  name: email_verified
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column: { name: given_name, type: varchar(120) }
              - column: { name: family_name, type: varchar(120) }
              - column: { name: picture_url, type: varchar(1024) }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: last_login_at, type: timestamp with time zone, constraints: { nullable: false } }

        - addUniqueConstraint:
            tableName: oauth_identities
            columnNames: provider, provider_subject
            constraintName: uk_oauth_identities_provider_subject

        - createIndex:
            tableName: oauth_identities
            indexName: idx_oauth_identities_user_id
            columns:
              - column: { name: user_id }

        - createIndex:
            tableName: oauth_identities
            indexName: idx_oauth_identities_email
            columns:
              - column: { name: email }
